<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
>

  <defs>

    <!-- ================================================== -->
    <!-- Paper -->
    <!-- ================================================== -->

    <linearGradient
      id="paper"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#f7f4eb"
      />

      <stop
        offset="100%"
        stop-color="#ebe6d8"
      />
    </linearGradient>


    <!-- ================================================== -->
    <!-- Far Mountain -->
    <!-- ================================================== -->

    <linearGradient
      id="farMountain"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#aeb8b0"
      />

      <stop
        offset="100%"
        stop-color="#d8d8cc"
      />
    </linearGradient>


    <!-- ================================================== -->
    <!-- Near Mountain -->
    <!-- ================================================== -->

    <linearGradient
      id="nearMountain"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#69756f"
      />

      <stop
        offset="100%"
        stop-color="#9ba39b"
      />
    </linearGradient>


    <!-- ================================================== -->
    <!-- Ink Blur -->
    <!-- ================================================== -->

    <filter id="inkBlur">
      <feGaussianBlur
        stdDeviation="8"
      />
    </filter>


    <!-- ================================================== -->
    <!-- Moon -->
    <!-- ================================================== -->

    <radialGradient id="moon">

      <stop
        offset="0%"
        stop-color="#eee8d8"
      />

      <stop
        offset="100%"
        stop-color="#d8d0bd"
      />

    </radialGradient>


    <!-- ================================================== -->
    <!-- Typography -->
    <!-- ================================================== -->

    <style>

      .title {

        font-family:
          "Noto Serif CJK SC",
          "Source Han Serif SC",
          "Songti SC",
          "STSong",
          serif;

        font-size:
          52px;

        font-weight:
          500;

        letter-spacing:
          4px;

        fill:
          #26332f;
      }


      .subtitle {

        font-family:
          "Noto Serif CJK SC",
          "Source Han Serif SC",
          "Songti SC",
          "STSong",
          serif;

        font-size:
          17px;

        letter-spacing:
          7px;

        fill:
          #69736d;
      }


      .date {

        font-family:
          "Helvetica Neue",
          Arial,
          sans-serif;

        font-size:
          15px;

        letter-spacing:
          3px;

        fill:
          #6d716d;
      }

    </style>

  </defs>


  <!-- ====================================================== -->
  <!-- Background -->
  <!-- ====================================================== -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="630"
    fill="url(#paper)"
  />


  <!-- ====================================================== -->
  <!-- Ink -->
  <!-- ====================================================== -->

  <ellipse
    cx="650"
    cy="440"
    rx="520"
    ry="120"
    fill="#89958c"
    opacity="0.12"
    filter="url(#inkBlur)"
  />


  <ellipse
    cx="950"
    cy="350"
    rx="280"
    ry="160"
    fill="#738078"
    opacity="0.08"
    filter="url(#inkBlur)"
  />


  <!-- ====================================================== -->
  <!-- Moon -->
  <!-- ====================================================== -->

  <circle
    cx="937"
    cy="127"
    r="48"
    fill="url(#moon)"
    opacity="0.9"
  />


  <!-- ====================================================== -->
  <!-- Far Mountain -->
  <!-- ====================================================== -->

  <path
    d="
      M0 430

      C100 370
        150 385
        240 330

      C320 280
        380 345
        460 300

      C540 255
        590 315
        670 285

      C760 250
        820 325
        900 290

      C1010 245
        1080 310
        1200 270

      L1200 630
      L0 630
      Z
    "
    fill="url(#farMountain)"
    opacity="0.55"
  />


  <!-- ====================================================== -->
  <!-- Near Mountain -->
  <!-- ====================================================== -->

  <path
    d="
      M0 500

      C110 463
        180 493
        270 418

      C350 353
        430 478
        520 413

      C610 343
        690 473
        780 398

      C870 333
        980 453
        1080 373

      C1130 343
        1170 373
        1200 353

      L1200 630
      L0 630
      Z
    "
    fill="url(#nearMountain)"
    opacity="0.52"
  />


  <!-- ====================================================== -->
  <!-- Mountain Ridge -->
  <!-- ====================================================== -->

  <path
    d="
      M0 510

      C140 445
        205 480
        300 410

      C400 335
        450 475
        560 405

      C650 350
        710 460
        820 390

      C930 320
        1000 440
        1110 370

      C1150 345
        1180 355
        1200 345
    "
    fill="none"
    stroke="#59645e"
    stroke-width="3"
    opacity="0.35"
  />


  <!-- ====================================================== -->
  <!-- Water -->
  <!-- ====================================================== -->

  <path
    d="
      M0 520

      C160 500
        270 535
        420 515

      C600 490
        720 540
        880 510

      C1030 485
        1110 520
        1200 500

      L1200 630
      L0 630
      Z
    "
    fill="#c4cbc4"
    opacity="0.38"
  />


  <!-- ====================================================== -->
  <!-- Water Lines -->
  <!-- ====================================================== -->

  <path
    d="
      M120 565

      C300 550
        430 575
        600 558

      C760 542
        900 570
        1080 550
    "
    fill="none"
    stroke="#77827b"
    stroke-width="2"
    opacity="0.28"
  />


  <path
    d="
      M230 595

      C400 580
        560 605
        720 588

      C850 575
        960 595
        1100 580
    "
    fill="none"
    stroke="#77827b"
    stroke-width="1.5"
    opacity="0.20"
  />


  <!-- ====================================================== -->
  <!-- Title -->
  <!-- ====================================================== -->

  
          <text
            x="280"
            y="145"
            class="title"
          >这家央企为何周六周日都</text>
        

          <text
            x="280"
            y="217"
            class="title"
          >要加班？</text>
        


  <!-- Title separator -->

  <rect
    x="280"
    y="299"
    width="42"
    height="2"
    fill="#52615a"
    opacity="0.7"
  />


  <!-- ====================================================== -->
  <!-- Subtitle -->
  <!-- ====================================================== -->

  <text
    x="280"
    y="344"
    class="subtitle"
  >RECORD · THINK · GROW</text>


  <!-- ====================================================== -->
  <!-- Date -->
  <!-- ====================================================== -->

  <text
    x="280"
    y="289"
    class="date"
  >2026.09.22</text>


  <!-- ====================================================== -->
  <!-- Boat -->
  <!-- ====================================================== -->

  <path
    d="
      M289 500

      Q334 492
        379 500

      Q334 515
        289 500

      Z
    "
    fill="#4d5752"
    opacity="0.75"
  />


  <line
    x1="334"
    y1="500"
    x2="334"
    y2="455"
    stroke="#4d5752"
    stroke-width="2"
    opacity="0.65"
  />


  <path
    d="
      M334 457
      L334 490
      L364 475
      Z
    "
    fill="#66716b"
    opacity="0.5"
  />

</svg>
