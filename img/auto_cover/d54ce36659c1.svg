<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
>

  <defs>

    <!-- ================================================== -->
    <!-- Paper -->
    <!-- ================================================== -->

    <linearGradient
      id="paper"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#f7f4eb"
      />

      <stop
        offset="100%"
        stop-color="#ebe6d8"
      />
    </linearGradient>


    <!-- ================================================== -->
    <!-- Far Mountain -->
    <!-- ================================================== -->

    <linearGradient
      id="farMountain"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#aeb8b0"
      />

      <stop
        offset="100%"
        stop-color="#d8d8cc"
      />
    </linearGradient>


    <!-- ================================================== -->
    <!-- Near Mountain -->
    <!-- ================================================== -->

    <linearGradient
      id="nearMountain"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#69756f"
      />

      <stop
        offset="100%"
        stop-color="#9ba39b"
      />
    </linearGradient>


    <!-- ================================================== -->
    <!-- Ink Blur -->
    <!-- ================================================== -->

    <filter id="inkBlur">
      <feGaussianBlur
        stdDeviation="8"
      />
    </filter>


    <!-- ================================================== -->
    <!-- Moon -->
    <!-- ================================================== -->

    <radialGradient id="moon">

      <stop
        offset="0%"
        stop-color="#eee8d8"
      />

      <stop
        offset="100%"
        stop-color="#d8d0bd"
      />

    </radialGradient>


    <!-- ================================================== -->
    <!-- Typography -->
    <!-- ================================================== -->

    <style>

      .title {

        font-family:
          "Noto Serif CJK SC",
          "Source Han Serif SC",
          "Songti SC",
          "STSong",
          serif;

        font-size:
          52px;

        font-weight:
          500;

        letter-spacing:
          4px;

        fill:
          #26332f;
      }


      .subtitle {

        font-family:
          "Noto Serif CJK SC",
          "Source Han Serif SC",
          "Songti SC",
          "STSong",
          serif;

        font-size:
          17px;

        letter-spacing:
          7px;

        fill:
          #69736d;
      }


      .date {

        font-family:
          "Helvetica Neue",
          Arial,
          sans-serif;

        font-size:
          15px;

        letter-spacing:
          3px;

        fill:
          #6d716d;
      }

    </style>

  </defs>


  <!-- ====================================================== -->
  <!-- Background -->
  <!-- ====================================================== -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="630"
    fill="url(#paper)"
  />


  <!-- ====================================================== -->
  <!-- Ink -->
  <!-- ====================================================== -->

  <ellipse
    cx="650"
    cy="440"
    rx="520"
    ry="120"
    fill="#89958c"
    opacity="0.12"
    filter="url(#inkBlur)"
  />


  <ellipse
    cx="950"
    cy="350"
    rx="280"
    ry="160"
    fill="#738078"
    opacity="0.08"
    filter="url(#inkBlur)"
  />


  <!-- ====================================================== -->
  <!-- Moon -->
  <!-- ====================================================== -->

  <circle
    cx="1038"
    cy="108"
    r="48"
    fill="url(#moon)"
    opacity="0.9"
  />


  <!-- ====================================================== -->
  <!-- Far Mountain -->
  <!-- ====================================================== -->

  <path
    d="
      M0 430

      C100 370
        150 385
        240 330

      C320 280
        380 345
        460 300

      C540 255
        590 315
        670 285

      C760 250
        820 325
        900 290

      C1010 245
        1080 310
        1200 270

      L1200 630
      L0 630
      Z
    "
    fill="url(#farMountain)"
    opacity="0.55"
  />


  <!-- ====================================================== -->
  <!-- Near Mountain -->
  <!-- ====================================================== -->

  <path
    d="
      M0 500

      C110 422
        180 452
        270 377

      C350 312
        430 437
        520 372

      C610 302
        690 432
        780 357

      C870 292
        980 412
        1080 332

      C1130 302
        1170 332
        1200 312

      L1200 630
      L0 630
      Z
    "
    fill="url(#nearMountain)"
    opacity="0.52"
  />


  <!-- ====================================================== -->
  <!-- Mountain Ridge -->
  <!-- ====================================================== -->

  <path
    d="
      M0 510

      C140 445
        205 480
        300 410

      C400 335
        450 475
        560 405

      C650 350
        710 460
        820 390

      C930 320
        1000 440
        1110 370

      C1150 345
        1180 355
        1200 345
    "
    fill="none"
    stroke="#59645e"
    stroke-width="3"
    opacity="0.35"
  />


  <!-- ====================================================== -->
  <!-- Water -->
  <!-- ====================================================== -->

  <path
    d="
      M0 523

      C160 503
        270 538
        420 518

      C600 493
        720 543
        880 513

      C1030 488
        1110 523
        1200 503

      L1200 630
      L0 630
      Z
    "
    fill="#c4cbc4"
    opacity="0.38"
  />


  <!-- ====================================================== -->
  <!-- Water Lines -->
  <!-- ====================================================== -->

  <path
    d="
      M120 565

      C300 550
        430 575
        600 558

      C760 542
        900 570
        1080 550
    "
    fill="none"
    stroke="#77827b"
    stroke-width="2"
    opacity="0.28"
  />


  <path
    d="
      M230 595

      C400 580
        560 605
        720 588

      C850 575
        960 595
        1100 580
    "
    fill="none"
    stroke="#77827b"
    stroke-width="1.5"
    opacity="0.20"
  />


  <!-- ====================================================== -->
  <!-- Title -->
  <!-- ====================================================== -->

  
          <text
            x="280"
            y="145"
            class="title"
          >普通人三种职业之路的选</text>
        

          <text
            x="280"
            y="217"
            class="title"
          >择</text>
        


  <!-- Title separator -->

  <rect
    x="280"
    y="299"
    width="42"
    height="2"
    fill="#52615a"
    opacity="0.7"
  />


  <!-- ====================================================== -->
  <!-- Subtitle -->
  <!-- ====================================================== -->

  <text
    x="280"
    y="344"
    class="subtitle"
  >RECORD · THINK · GROW</text>


  <!-- ====================================================== -->
  <!-- Date -->
  <!-- ====================================================== -->

  <text
    x="280"
    y="289"
    class="date"
  >2021.09.24</text>


  <!-- ====================================================== -->
  <!-- Boat -->
  <!-- ====================================================== -->

  <path
    d="
      M316 500

      Q361 492
        406 500

      Q361 515
        316 500

      Z
    "
    fill="#4d5752"
    opacity="0.75"
  />


  <line
    x1="361"
    y1="500"
    x2="361"
    y2="455"
    stroke="#4d5752"
    stroke-width="2"
    opacity="0.65"
  />


  <path
    d="
      M361 457
      L361 490
      L391 475
      Z
    "
    fill="#66716b"
    opacity="0.5"
  />

</svg>
